[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    --strict-markers
    --cov=tests/_lib
    --cov=eshkol-matching
    --cov-report=term-missing
    --cov-fail-under=80
markers =
    slow: reads the 189 MB unified_all.csv; deselect with -m "not slow"
    traceability: checks a published figure against its raw source
