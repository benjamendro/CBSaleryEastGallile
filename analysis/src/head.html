<title>שכר באשכול גליל מזרחי</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@500;700;800&family=Assistant:wght@300;400;600;700&family=Heebo:wght@400;500;700;800&display=swap">
<style>
:root{
  --paper:#F2F5F7; --card:#FFFFFF; --card-2:#FAFCFD;
  --ink:#14273F; --ink-2:#41566B; --ink-3:#74879A;
  --rule:#D6E1E8; --rule-2:#E8EEF2;
  --accent:#1C548C; --accent-soft:#E3EBF3;
  --s1:#1C548C; --s2:#B0701A; --s3:#8C1C8C; --s4:#5E7F14;
  --warm:#B0701A; --neg:#9E2B2B; --pos:#2F6B3A;
  --shadow:0 1px 2px rgba(20,39,63,.06), 0 8px 24px -12px rgba(20,39,63,.18);
  --f-disp:"Frank Ruhl Libre",Georgia,"Times New Roman",serif;
  --f-body:"Assistant","Segoe UI",system-ui,sans-serif;
  --f-num:"Heebo","Segoe UI",system-ui,sans-serif;
  --wrap:1160px; --prose:68ch;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#0D1822; --card:#14232F; --card-2:#182936;
  --ink:#E4EDF4; --ink-2:#A7BCCC; --ink-3:#7A93A6;
  --rule:#24384A; --rule-2:#1C2E3D;
  --accent:#6BA7DE; --accent-soft:#1B3247;
  --s1:#3D8FD8; --s2:#B87818; --s3:#BC5CBC; --s4:#74991F;
  --warm:#D0913A; --neg:#D2726B; --pos:#79B487;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --paper:#0D1822; --card:#14232F; --card-2:#182936;
  --ink:#E4EDF4; --ink-2:#A7BCCC; --ink-3:#7A93A6;
  --rule:#24384A; --rule-2:#1C2E3D;
  --accent:#6BA7DE; --accent-soft:#1B3247;
  --s1:#3D8FD8; --s2:#B87818; --s3:#BC5CBC; --s4:#74991F;
  --warm:#D0913A; --neg:#D2726B; --pos:#79B487;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
     font-size:17px;line-height:1.7;direction:rtl;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-disp);margin:0;line-height:1.18;text-wrap:balance;font-weight:700}
p{margin:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:24px}
.prose{max-width:var(--prose)}
.stack{display:flex;flex-direction:column}

/* ---- top bar ---- */
.bar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);
     backdrop-filter:blur(10px);border-block-end:1px solid var(--rule)}
.bar .wrap{display:flex;align-items:center;gap:20px;height:54px}
.bar .mark{font-family:var(--f-disp);font-weight:800;font-size:15px;letter-spacing:.01em;white-space:nowrap}
.bar nav{display:flex;gap:2px;overflow-x:auto;margin-inline-start:auto;scrollbar-width:none}
.bar nav::-webkit-scrollbar{display:none}
.bar a{font-family:var(--f-num);font-size:13px;font-weight:500;color:var(--ink-3);text-decoration:none;
       padding:6px 10px;border-radius:6px;white-space:nowrap}
.bar a:hover{color:var(--ink);background:var(--rule-2)}

/* ---- hero ---- */
.hero{padding:72px 0 40px;border-block-end:1px solid var(--rule)}
.kicker{font-family:var(--f-num);font-size:12.5px;font-weight:700;letter-spacing:.09em;
        color:var(--accent);text-transform:none;display:flex;gap:10px;align-items:center}
.kicker::after{content:"";height:1px;flex:1;background:var(--rule);max-width:120px}
h1{font-size:clamp(38px,6vw,64px);font-weight:800;letter-spacing:-.02em;margin-block:18px 0}
.lede{font-size:clamp(19px,2.1vw,23px);line-height:1.55;color:var(--ink-2);max-width:60ch;margin-block-start:22px;font-weight:300}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-block-start:28px;font-family:var(--f-num);
      font-size:13px;color:var(--ink-3)}
.meta b{color:var(--ink-2);font-weight:600}

/* ---- kpis ---- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(178px,1fr));gap:1px;
      background:var(--rule);border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-block-start:44px}
.kpi{background:var(--card);padding:20px 18px 18px}
.kpi .n{font-family:var(--f-num);font-weight:800;font-size:38px;line-height:1;letter-spacing:-.02em;
        font-variant-numeric:tabular-nums;color:var(--ink)}
.kpi .n small{font-size:19px;font-weight:700;color:var(--ink-3);margin-inline-start:2px}
.kpi .l{font-size:14px;color:var(--ink-2);margin-block-start:9px;line-height:1.45}
.kpi.hi .n{color:var(--accent)}

/* ---- sections ---- */
section{padding-block:56px;border-block-end:1px solid var(--rule)}
section:last-of-type{border:0}
.sechead{display:flex;flex-direction:column;gap:14px;margin-block-end:30px}
h2{font-size:clamp(27px,3.4vw,38px);letter-spacing:-.015em}
h3{font-size:20px;font-weight:700;margin-block-start:34px}
h4{font-size:16px;font-weight:700;margin-block-start:26px;color:var(--ink-2)}
.sechead .k{font-family:var(--f-num);font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3)}
.body p+p{margin-block-start:16px}
.body{color:var(--ink-2)}
.body strong{color:var(--ink);font-weight:600}
.explain{background:var(--accent-soft);border-radius:10px;padding:14px 18px;margin-block-start:18px;
        font-size:15.5px;line-height:1.6;color:var(--ink-2)}
.explain b{color:var(--ink);font-weight:700}
.fine{font-size:14.5px;color:var(--ink-3);line-height:1.6;border-inline-start:2px solid var(--rule);
      padding-inline-start:14px;margin-block-start:18px!important}
.fine b{color:var(--ink-2);font-weight:600}

/* ---- figure ---- */
figure{margin:34px 0 0;background:var(--card);border:1px solid var(--rule);border-radius:12px;
       padding:22px 22px 16px;box-shadow:var(--shadow)}
figcaption{font-size:14px;color:var(--ink-3);line-height:1.55;margin-block-start:14px;
           padding-block-start:12px;border-block-start:1px solid var(--rule-2)}
figcaption b{color:var(--ink-2);font-weight:600}
.figtitle{font-family:var(--f-disp);font-weight:700;font-size:18px;margin-block-end:3px}
.figsub{font-family:var(--f-num);font-size:13px;color:var(--ink-3);margin-block-end:16px}
.chartbox{overflow-x:auto}
svg{display:block;max-width:100%;height:auto;direction:ltr}
.sw{display:inline-block}
.kpi .n,.meta b,td.num{direction:ltr;unicode-bidi:isolate}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;margin-block-end:14px;font-family:var(--f-num);font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.sw{width:11px;height:11px;border-radius:3px;flex:none}
.sw.line{height:3px;width:16px;border-radius:2px}

/* ---- tables ---- */
details{margin-block-start:12px}
summary{font-family:var(--f-num);font-size:13px;color:var(--ink-3);cursor:pointer;font-weight:500}
summary:hover{color:var(--ink)}
table{border-collapse:collapse;width:100%;font-family:var(--f-num);font-size:13.5px;margin-block-start:12px}
th,td{text-align:right;padding:7px 10px;border-block-end:1px solid var(--rule-2);font-variant-numeric:tabular-nums}
th{font-weight:700;color:var(--ink-3);font-size:12px;letter-spacing:.03em;border-block-end:1px solid var(--rule)}
tbody tr:hover{background:var(--card-2)}
td.name{font-family:var(--f-body);font-size:14.5px;font-weight:600;color:var(--ink);text-align:right}
td.num{font-weight:500}
.tw{overflow-x:auto}

/* ---- callout ---- */
.call{margin-block-start:30px;background:var(--card);border:1px solid var(--rule);
      border-inline-start:3px solid var(--accent);border-radius:10px;padding:20px 22px}
.call .t{font-family:var(--f-disp);font-weight:700;font-size:17px;margin-block-end:8px}
.call p{font-size:15.5px;color:var(--ink-2);line-height:1.65}
.call.warn{border-inline-start-color:var(--warm)}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-block-start:30px}
.pull{font-family:var(--f-disp);font-size:clamp(22px,2.8vw,29px);line-height:1.35;color:var(--ink);
      font-weight:700;margin-block:34px;padding-inline-start:20px;border-inline-start:3px solid var(--accent);max-width:34ch}

ul.pts{margin:18px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:13px}
ul.pts li{position:relative;padding-inline-start:22px;color:var(--ink-2);font-size:16px;line-height:1.6}
ul.pts li::before{content:"";position:absolute;inset-inline-start:0;top:.62em;width:7px;height:7px;
                  border-radius:2px;background:var(--accent)}
ul.pts li b{color:var(--ink);font-weight:600}

footer{padding:44px 0 64px;color:var(--ink-3);font-family:var(--f-num);font-size:13.5px;line-height:1.7}
footer b{color:var(--ink-2)}
.tip{position:fixed;pointer-events:none;background:var(--card);border:1px solid var(--rule);
     border-radius:8px;padding:9px 12px;font-family:var(--f-num);font-size:12.5px;color:var(--ink);
     box-shadow:var(--shadow);opacity:0;transition:opacity .12s;z-index:80;white-space:nowrap;
     font-variant-numeric:tabular-nums}
.tip.on{opacity:1}
.tip b{display:block;font-size:13px;margin-block-end:4px;font-family:var(--f-body)}
.tip i{font-style:normal;color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:640px){ .hero{padding-block-start:44px} section{padding-block:40px} figure{padding:16px 14px 12px} }
</style>
